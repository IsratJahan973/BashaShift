# Local development only. Hosted Auth settings are documented in docs/SUPABASE_SETUP.md.
project_id = "BashaShift"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# PostgreSQL 15 keeps the disposable local stack smaller; the migration also targets hosted PostgreSQL 17.
major_version = 15

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "3MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:8787", "http://localhost:8787"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Local tests receive a session immediately. Enable confirmations in the hosted dashboard.
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
